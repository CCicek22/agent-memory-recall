[project]
name = "agent-memory-recall"
version = "0.1.0"
description = "Prompt-time memory recall for coding agents: vector search over Markdown notes, injected as a short context block."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Mack Cicek" }]
keywords = ["claude-code", "hooks", "memory", "embeddings", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
# The hook, CLI, server and eval are stdlib-only.
dependencies = []

[project.optional-dependencies]
# Only the local embedding server needs these.
embed = [
    "numpy>=2.5.5,<3",
    "sentence-transformers>=6.3.0,<7",
    "torch>=2.15.0,<3",
]

[project.scripts]
memory-recall = "memory_recall.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
